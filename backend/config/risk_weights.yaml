# Findings below this identity-match confidence (%) are excluded from scoring.
confidence_threshold: 40

# Overall score = strongest weighted finding + secondary_factor * sum of the
# rest, capped at `cap`. Each finding's weighted score = weight * confidence%.
aggregation:
  secondary_factor: 0.25
  cap: 100

# Risk level thresholds (score >= value).
thresholds:
  low: 0
  medium: 25
  high: 50
  critical: 80
