# Risk-scoring configuration. Tune weights and thresholds here — no code
# changes required (there are no admin accounts in the MVP).

# Base severity weight per finding category (0-100).
categories:
  sanctions: 100
  disqualification: 90
  insolvency: 70
  regulatory: 70
  adverse_media: 20      # general negative media; escalated by keywords below
  directorship: 5        # informational — directorships are not adverse per se
  web: 5
  social_media: 5        # neutral public profiles/posts; posts containing
                         # adverse/conduct terms arrive as adverse_media instead
  # DVLA driving licence check (only runs when a licence number is supplied):
  driving_disqualification: 60
  driving_licence_issue: 40   # revoked / expired / surrendered / not found
  driving_endorsement: 30
  driving_licence: 0          # verified-valid — informational only

# Adverse-keyword escalation. The keyword list itself (large and deliberately
# broad) lives in config/adverse_keywords.yaml and is screened against every
# finding from every source. Findings in these categories are raised to the
# weight of the worst keyword tier they contain (serious = 60, general = 20).
keyword_escalation_categories:
  - adverse_media
  - web
  - social_media

# Findings below this identity-match confidence (%) are excluded from scoring.
confidence_threshold: 40

# Overall score = strongest weighted finding + secondary_factor * sum of the
# rest, capped at `cap`. Each finding's weighted score = weight * confidence%.
aggregation:
  secondary_factor: 0.25
  cap: 100

# Risk level thresholds (score >= value).
thresholds:
  low: 0
  medium: 25
  high: 50
  critical: 80
