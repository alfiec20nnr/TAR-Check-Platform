# Risk-scoring configuration. Tune weights and thresholds here — no code
# changes required (there are no admin accounts in the MVP).

# Base severity weight per finding category (0-100).
categories:
  sanctions: 100
  disqualification: 90
  insolvency: 70
  regulatory: 70
  adverse_media: 20      # general negative media; escalated by keywords below
  directorship: 5        # informational — directorships are not adverse per se
  web: 5
  social_media: 5        # neutral public profiles/posts; posts containing
                         # adverse/conduct terms arrive as adverse_media instead
  # DVLA driving licence check (only runs when a licence number is supplied):
  driving_disqualification: 60
  driving_licence_issue: 40   # revoked / expired / surrendered / not found
  driving_endorsement: 30
  driving_licence: 0          # verified-valid — informational only

# Adverse-media escalation: if a finding's title/description contains any of
# these terms, its weight is raised to `weight` (serious adverse media).
media_keywords:
  serious:
    weight: 60
    terms:
