# Adverse-keyword screening list — applied to EVERY finding from EVERY source.
#
# The list is deliberately broad: it is better to flag an irrelevant result
# than to miss a valuable one. A keyword hit never discards anything; it
#   - flags the finding with the matched terms (shown in the UI and report),
#   - re-categorises neutral web / social-media results as adverse media, and
#   - escalates media-type findings to the tier's risk weight below.
#
# Matching rules (case-insensitive, accents and HTML stripped):
#   - a term matches whole words only: "ban" matches "ban"/"bans", not "bank"
#   - a trailing "*" matches any word ending: "fraud*" -> fraudster, fraudulent
#   - plain terms also match a simple plural (+s / +es)
#   - spaces in a phrase also match hyphens: "drink driving" -> "drink-driving"
#
# Edit freely — no code changes needed. Groups are only for readability and
# for showing *why* a result was flagged.

