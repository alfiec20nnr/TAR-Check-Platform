[project]
name = "aip-backend"
version = "0.1.0"
description = "Adverse Intelligence Platform backend (modular monolith)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# conftest must set env vars before importing any app module.
"tests/conftest.py" = ["E402", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py", "app/seed.py", "alembic/*"]
